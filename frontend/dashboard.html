<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pulse &amp; Plate — Results Dashboard</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A41;
    --ink-soft:#4A5870;
    --paper:#FFFFFF;
    --raised:#FFFFFF;
    --rule:#DDE3EC;
    --rule-strong:#B8C4D6;
    --risk-high:#E04B2A;
    --risk-mid:#C98A1F;
    --risk-low:#2F7A51;
    --info:#1F4E8C;
    --info-soft:#E4ECF7;
    --focus:#1F4E8C;
    --radius:10px;
    --radius-lg:16px;
    --maxw:1180px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Amiri", Georgia, serif; font-size:17.5px; line-height:1.5;
  }
  h1,h2{font-family:"Amiri", Georgia, serif; font-weight:600; margin:0;}
  :focus-visible{outline:2.5px solid var(--focus); outline-offset:2px;}
  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  header{
    border-bottom:1px solid var(--rule);
    padding:26px 0 22px;
  }
  header h1{font-size:1.7rem;}
  header p{margin:6px 0 0; color:var(--ink-soft);}
  main{padding:26px 0 60px;}

  .toolbar{
    display:flex; flex-wrap:wrap; gap:12px; align-items:center;
    margin-bottom:18px;
  }
  .toolbar input[type="search"]{
    font:inherit; padding:9px 12px; border:1.5px solid var(--rule-strong);
    border-radius:var(--radius); background:var(--raised); min-width:220px;
  }
  .stat-chip{
    font-size:0.86rem; font-weight:600; color:var(--ink-soft);
    background:var(--raised); border:1px solid var(--rule);
    padding:7px 13px; border-radius:999px;
  }
  button.refresh{
    font:inherit; font-weight:700; font-size:0.86rem;
    background:var(--ink); color:#fff; border:0;
    padding:9px 16px; border-radius:999px; cursor:pointer;
  }

  table{
    width:100%; border-collapse:collapse;
    background:var(--raised); border:1px solid var(--rule); border-radius:var(--radius-lg);
    overflow:hidden;
  }
  thead th{
    text-align:left; font-size:0.78rem; font-weight:700; color:var(--ink-soft);
    text-transform:none; padding:12px 14px; border-bottom:1px solid var(--rule);
    background:#F6F9F8;
  }
  tbody td{
    padding:12px 14px; border-bottom:1px solid var(--rule);
    vertical-align:top;
  }
  tbody tr:last-child td{border-bottom:0;}
  tbody tr:hover{background:#FAFCFB;}
  .name-cell{font-weight:700;}
  .date-cell{color:var(--ink-soft); font-size:0.88rem; white-space:nowrap;}
  .risk-pill{
    display:inline-block; font-weight:700; font-size:0.84rem;
    padding:3px 10px; border-radius:999px;
  }
  .risk-pill.high{background:#FBEAE5; color:var(--risk-high);}
  .risk-pill.mid{background:#FBF2E2; color:var(--risk-mid);}
  .risk-pill.low{background:#E6F2EA; color:var(--risk-low);}
  .factors-cell{font-size:0.88rem; color:var(--ink-soft); max-width:360px;}
  .factors-cell span{
    display:inline-block; margin:0 6px 4px 0; padding:2px 8px;
    background:var(--info-soft); color:var(--info); border-radius:999px; font-size:0.8rem;
  }
  .empty, .error{
    padding:40px 20px; text-align:center; color:var(--ink-soft);
    background:var(--raised); border:1px solid var(--rule); border-radius:var(--radius-lg);
  }
  .error{color:#7A2A17; background:#FBEAE5; border-color:#F0C9BE;}
  .row-detail{display:none;}
  .row-detail.open{display:table-row;}
  .row-detail td{background:#F9FBFA; font-size:0.88rem; color:var(--ink-soft); white-space:pre-wrap;}
  .expand-btn{
    font:inherit; font-size:0.78rem; font-weight:700; color:var(--info);
    background:none; border:0; cursor:pointer; padding:0;
  }
</style>
</head>
<body>

<header class="wrap">
  <h1>Results dashboard</h1>
  <p>Every risk assessment submitted through Pulse &amp; Plate, newest first. This page needs the admin key. Don't share the key or the link outside your team.</p>
</header>

<main class="wrap">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Search by name…">
    <span class="stat-chip" id="countChip">Loading…</span>
    <button class="refresh" id="refreshBtn" type="button">Refresh</button>
  </div>

  <div id="loginBox" style="display:none;max-width:380px;margin:18px 0;padding:18px;border:1px solid #c9d9ee;border-radius:12px;background:#f3f7fd">
    <label for="pw" style="display:block;font-weight:700;margin-bottom:8px">Enter the dashboard password</label>
    <input id="pw" type="password" autocomplete="current-password" style="width:100%;padding:10px;border:1px solid #9db8dc;border-radius:8px;font-size:1rem">
    <div id="pwMsg" style="color:#b3261e;margin:8px 0;min-height:1.2em"></div>
    <button id="pwBtn" type="button" style="padding:10px 18px;border:0;border-radius:999px;background:#1d4f8a;color:#fff;font-weight:700;cursor:pointer">Open dashboard</button>
  </div>
  <div id="tableWrap">
    <div class="empty">Loading results…</div>
  </div>
</main>

<script>
(function(){
  "use strict";
  var BACKEND_URL = "https://backend-production-b3eff.up.railway.app";
  var allRows = [];

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function fmtDate(iso){
    try{
      var d = new Date(iso.replace(" ", "T") + "Z");
      return d.toLocaleString(undefined, {year:"numeric", month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
    }catch(e){ return iso; }
  }

  function riskTier(p){
    if (p >= 0.5) return "high";
    if (p >= 0.33) return "mid";
    return "low";
  }

  var FACTOR_LABELS = {
    RIDAGEYR:"Age", RIDRETH3:"Race/ethnicity", INDFMPIR:"Income ratio",
    BMXBMI:"BMI", BMXWAIST:"Waist", DR1TSODI:"Sodium", DR1TPOTA:"Potassium",
    DR1TTFAT:"Fat", DR1TALCO:"Alcohol", SMQ020:"Smoking"
  };

  function renderTable(rows){
    var wrap = document.getElementById("tableWrap");
    if (!rows.length){
      wrap.innerHTML = '<div class="empty">No assessments match yet.</div>';
      return;
    }
    var body = rows.map(function(r, i){
      var pct = Math.round(r.risk_probability * 100);
      var tier = riskTier(r.risk_probability);
      var factors = [];
      try{
        var tf = JSON.parse(r.top_factors_json || "[]");
        factors = tf.slice(0,3).map(function(f){ return FACTOR_LABELS[f[0]] || f[0]; });
      }catch(e){}
      var guidanceText = "";
      try{
        var g = JSON.parse(r.guidance_json || "[]");
        guidanceText = g.map(function(item){ return "- " + item.label + ": " + item.recommendation; }).join("\n\n");
      }catch(e){}
      return (
        '<tr>' +
          '<td class="name-cell">' + escapeHtml(r.name || "(no name given)") + '</td>' +
          '<td class="date-cell">' + escapeHtml(fmtDate(r.created_at)) + '</td>' +
          '<td><span class="risk-pill ' + tier + '">' + pct + '%</span></td>' +
          '<td class="factors-cell">' + factors.map(function(f){ return '<span>' + escapeHtml(f) + '</span>'; }).join("") + '</td>' +
          '<td><button class="expand-btn" data-idx="' + i + '">View guidance</button></td>' +
        '</tr>' +
        '<tr class="row-detail" id="detail-' + i + '"><td colspan="5">' + escapeHtml(guidanceText || "No guidance recorded.") + '</td></tr>'
      );
    }).join("");

    wrap.innerHTML =
      '<table><thead><tr>' +
        '<th>Name</th><th>Submitted</th><th>Risk</th><th>Top factors</th><th></th>' +
      '</tr></thead><tbody>' + body + '</tbody></table>';

    wrap.querySelectorAll(".expand-btn").forEach(function(btn){
      btn.addEventListener("click", function(){
        var row = document.getElementById("detail-" + btn.getAttribute("data-idx"));
        row.classList.toggle("open");
        btn.textContent = row.classList.contains("open") ? "Hide guidance" : "View guidance";
      });
    });
  }

  function applyFilter(){
    var q = document.getElementById("search").value.trim().toLowerCase();
    var filtered = !q ? allRows : allRows.filter(function(r){
      return (r.name || "").toLowerCase().indexOf(q) !== -1;
    });
    document.getElementById("countChip").textContent =
      filtered.length + " of " + allRows.length + " assessment" + (allRows.length === 1 ? "" : "s");
    renderTable(filtered);
  }

  function showLogin(msg){
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("pwMsg").textContent = msg || "";
    document.getElementById("countChip").textContent = "Locked";
    document.getElementById("tableWrap").innerHTML = "";
    try { localStorage.removeItem("adminKey"); } catch(e){}
  }
  document.getElementById("pwBtn").addEventListener("click", function(){
    var v = document.getElementById("pw").value.trim(); if (!v) return;
    try { localStorage.setItem("adminKey", v); } catch(e){}
    document.getElementById("pw").value = ""; document.getElementById("loginBox").style.display = "none"; load();
  });
  document.getElementById("pw").addEventListener("keydown", function(e){ if (e.key === "Enter") document.getElementById("pwBtn").click(); });

  function load(){
    document.getElementById("countChip").textContent = "Loading…";
    document.getElementById("tableWrap").innerHTML = '<div class="empty">Loading results…</div>';
    var key = "";
    try { key = new URLSearchParams(location.search).get("key") || localStorage.getItem("adminKey") || ""; } catch(e){}
    fetch(BACKEND_URL + "/assessments?limit=500&key=" + encodeURIComponent(key))
      .then(function(res){
        if (res.status === 401){
          showLogin(key ? "That password did not work. Please try again." : "");
          throw new Error("Password needed.");
        }
        if (!res.ok) throw new Error("Server returned " + res.status);
        return res.json();
      })
      .then(function(data){
        allRows = data;
        applyFilter();
      })
      .catch(function(err){
        if (err.message === "Password needed.") return;
        document.getElementById("countChip").textContent = "Error";
        document.getElementById("tableWrap").innerHTML =
          '<div class="error">Could not load results: ' + escapeHtml(err.message) + '</div>';
      });
  }

  document.getElementById("search").addEventListener("input", applyFilter);
  document.getElementById("refreshBtn").addEventListener("click", load);
  load();
})();
</script>

</body>
</html>
